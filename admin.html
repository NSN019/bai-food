<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BAI FOOD — Касса</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

<header class="topbar">
  <div>
    <p class="small-title">BAI FOOD & SUSHI BAR</p>
    <h1>Касса</h1>
  </div>

  <div class="status-online">
    <span></span>
    Онлайн
  </div>
</header>


<main class="container">

  <!-- КҮНДІ ТАҢДАУ -->
  <section class="date-panel">

    <button
      class="date-arrow"
      onclick="changeDate(-1)"
    >
      ←
    </button>

    <div class="date-center">

      <span class="date-caption">
        Заказы за день
      </span>

      <strong id="selected-date-label">
        Сегодня
      </strong>

      <input
        id="order-date"
        class="date-input"
        type="date"
        onchange="selectDate(this.value)"
      >

    </div>

    <button
      class="date-arrow"
      onclick="changeDate(1)"
    >
      →
    </button>

    <button
      class="today-button"
      onclick="goToday()"
    >
      Сегодня
    </button>

  </section>


  <!-- СТАТИСТИКА -->
  <section class="stats">

    <div class="stat-card">
      <span>Всего заказов</span>
      <strong id="orders-count">0</strong>
    </div>

    <div class="stat-card">
      <span>Ожидают оплаты</span>
      <strong id="waiting-count">0</strong>
    </div>

    <div class="stat-card">
      <span>Оплачено</span>
      <strong id="paid-count">0</strong>
    </div>

    <div class="stat-card">
      <span>Выручка</span>
      <strong id="revenue">0 ₸</strong>
    </div>

  </section>


  <!-- ЗАКАЗДАР -->
  <section class="toolbar">

    <div>
      <h2>Заказы</h2>

      <p>
        Новые заказы появляются автоматически
      </p>
    </div>

    <button class="refresh-button">
      ↻ Обновить
    </button>

  </section>


  <!-- ФИЛЬТР -->
  <div class="tabs">

    <button
      class="tab active"
      onclick="setFilter('waiting', this)"
    >
      Ожидают оплаты
    </button>

    <button
      class="tab"
      onclick="setFilter('paid', this)"
    >
      Оплачено
    </button>

    <button
      class="tab"
      onclick="setFilter('all', this)"
    >
      Все
    </button>

  </div>


  <!-- ЗАКАЗ КАРТОЧКАЛАРЫ -->
  <section
    id="orders"
    class="orders"
  >
  </section>


  <!-- ЗАКАЗ ЖОҚ БОЛСА -->
  <div
    id="empty-state"
    class="empty-state"
  >

    <div>🍣</div>

    <h3>
      Нет заказов
    </h3>

    <p>
      За выбранный день заказов пока нет
    </p>

  </div>

</main>


<!-- ТӨЛЕМДІ РАСТАУ -->
<div
  id="confirm-modal"
  class="modal"
>

  <div class="modal-box">

    <div
      id="confirm-icon"
      class="modal-icon"
    >
      💵
    </div>

    <h2 id="confirm-title">
      Подтвердить оплату?
    </h2>

    <p id="confirm-text">
      Заказ
    </p>


    <div class="modal-actions">

      <button
        class="cancel-button"
        onclick="closeConfirmModal()"
      >
        Отмена
      </button>

      <button
        id="confirm-payment-button"
        class="confirm-button"
        onclick="confirmPayment()"
      >
        ✓ Оплачено
      </button>

    </div>

  </div>

</div>


<!-- ХАБАРЛАМА -->
<div
  id="toast"
  class="toast"
>
  ✓ Оплата подтверждена
</div>


<script src="admin.js"></script>

</body>
</html>
